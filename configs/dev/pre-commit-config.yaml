# Hooks run on the host in isolated envs, so they don't depend on a
# project's Python/Node version. Run `pre-commit autoupdate` after copying.
exclude: '(^|/)(migrations|node_modules|static|staticfiles|media)/|\.min\.(js|css)$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
