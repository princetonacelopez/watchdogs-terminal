# Dymus user configuration.
# Available themes: tokyo-night, catppuccin-mocha, gruvbox-dark, nord.
# Start view: home, explore, playlists, albums, artists, podcasts, radio, local, search, or queue.
# Headless picker results: 1 through 25.
# YouTube Music history reporting is off by default; threshold: 1 through 3600 seconds.
# Last.fm scrobbling is on by default when Last.fm credentials exist.
# Colors are optional six-digit hex overrides (examples below use Tokyo Night).
# Uncomment and edit any value:
# [colors]
# text = "#c0caf5"
# secondary = "#a9b1d6"
# muted = "#737aa2"
# accent = "#7aa2f7"
# good = "#9ece6a"
# warning = "#e0af68"
# error = "#f7768e"

theme = "tokyo-night"
start_view = "explore"
headless_results = 5
headless_search_results = 10
video_height = 1080
report_history = false
report_history_after_seconds = 30
lastfm_scrobbling = true

[downloads]
audio_path = "~/Music/Dymus"
video_path = "~/Videos/Dymus"
filename = "%(title)s [%(id)s].%(ext)s"
audio_format = "best"
audio_quality = "0"
video_format = "mp4"
organize_by_type = true
write_manifest = true
write_playlist = true
write_thumbnail = true
playlist_subdirectories = true
number_tracks = true
embed_metadata = true
embed_thumbnail = false
resume = true
overwrite = false
skip_downloaded = false
continue_on_error = true
progress = true
retries = 10
fragment_retries = 10
concurrent_fragments = 4
socket_timeout = 30

[local]
roots = []
include_downloads = true
scan_unindexed = true
recursive = true
read_tags = true
video = true

[colors]
text = "#E2F1FF"
secondary = "#00A8FF"
muted = "#7A93AC"
accent = "#00F0FF"
good = "#00FF9C"
warning = "#FFD600"
error = "#FF0055"

[keybindings]
quit = "q"
settings = "s"
search = "/"
help = "?"
home = "h"
explore = "e"
playlists = "1"
albums = "2"
artists = "3"
podcasts = "4"
radio = "o"
local = "5"
queue = "Tab"
now_playing = "t"
pause = "Space"
video = "V"
next_track = "n"
retry_track = "r"
volume_up = "+"
volume_down = "-"
